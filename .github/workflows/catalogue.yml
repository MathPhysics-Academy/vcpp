name: catalogue checks

# Checks spec/vpython/ against GlowScript's source and against vcpp's own src/. GlowScript is
# third-party, so it is fetched into the runner's temp directory at the pinned commit and never
# committed. src/ is a trigger because the tables record what vcpp wires: a vcpp change that alters
# that fails here until the tables are regenerated.
on:
  push:
    branches: [main]
    paths: ['spec/vpython/**', 'src/**', '.github/workflows/catalogue.yml']
  pull_request:
    paths: ['spec/vpython/**', 'src/**', '.github/workflows/catalogue.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GLOWSCRIPT_COMMIT: 744de985e42205989cc5d036c6b12b559cd55e4c
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GlowScript at the pinned commit
        run: |
          echo "VPYTHON_REF=$RUNNER_TEMP/vpython-reference" >> "$GITHUB_ENV"
          dest="$RUNNER_TEMP/vpython-reference/glowscript"
          git init -q "$dest"
          git -C "$dest" fetch -q --depth 1 https://github.com/vpython/glowscript "$GLOWSCRIPT_COMMIT"
          git -C "$dest" checkout -q FETCH_HEAD
          # Without the source, the citation checks cannot fail — so refuse to run rather than pass.
          test -f "$dest/lib/glow/canvas.js"

      - name: Check the committed tables
        run: python3 spec/vpython/tools/check_catalog.py

      - name: Convention-free invariants
        run: python3 spec/vpython/tools/invariants.py

      - name: Committed tables still match what the extractors produce
        # Regenerates catalog/ and parity/ from GlowScript and this checkout's src/, and compares every
        # column except the corpus counts, which need the private student labs.
        run: python3 spec/vpython/tools/check_regenerated.py
